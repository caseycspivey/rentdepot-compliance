<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technician SMS Consent — Rent Depot</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       background:#f5f5f5;color:#333;padding:24px;line-height:1.55}
  .card{background:#fff;border-radius:12px;padding:32px;max-width:680px;
        margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
  .logo{font-size:18px;font-weight:700;color:#1a56db;margin-bottom:18px}
  h1{font-size:22px;font-weight:700;margin-bottom:8px}
  p{font-size:14px;color:#444;margin-bottom:10px}
  label{display:block;font-size:13px;font-weight:600;margin-top:14px;margin-bottom:4px}
  input[type=text],input[type=tel]{width:100%;padding:10px 12px;border:1px solid #d0d4dc;
       border-radius:6px;font-size:15px}
  .consent{background:#f0f4ff;border:1px solid #c7d2fe;border-radius:8px;
           padding:14px 16px;margin-top:20px;font-size:13px;color:#1e293b}
  .consent input[type=checkbox]{margin-right:8px;vertical-align:middle}
  button{margin-top:18px;width:100%;padding:14px;background:#1a56db;color:#fff;
         border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
  button:hover{background:#1648c7}
  button:disabled{background:#94a3b8;cursor:not-allowed}
  .meta{font-size:12px;color:#888;margin-top:24px;padding-top:14px;border-top:1px solid #eee}
  a{color:#1a56db}
  .thanks{padding:16px 18px;background:#f0fdf4;border:1px solid #86efac;
          border-radius:8px;color:#15803d;font-size:14px;line-height:1.55}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">Rent Depot LLC</div>
  <h1>Technician SMS Consent</h1>
  <p>Confirm your contact info and consent to receive SMS work order
     notifications from Rent Depot.</p>

  <form id="consent-form">
    <label for="name">Technician name</label>
    <input type="text" id="name" name="name" required autocomplete="name">

    <label for="phone">Mobile number</label>
    <input type="tel" id="phone" name="phone" required placeholder="+1 812 555 1234"
           autocomplete="tel">

    <div class="consent">
      <label style="font-weight:500;margin-top:0">
        <input type="checkbox" name="consent" value="yes" required>
        I consent to receive SMS work order notifications from Rent Depot LLC
        at the mobile number provided. Message frequency varies (2–10 msgs/day
        on active work days). Message and data rates may apply. Reply
        <strong>STOP</strong> to opt out, <strong>HELP</strong> for help.
        See <a href="privacy.html">Privacy Policy</a> and
        <a href="terms.html">Terms</a>.
      </label>
    </div>

    <button type="submit" id="submit-btn">Submit Consent</button>
  </form>

  <div class="meta">Rent Depot LLC · PO Box 4, Evansville, IN 47701 · 844-736-8337</div>
</div>

<script>
  // No backend on this static host — the form is for displaying the consent
  // flow (carrier compliance review) and capturing the entry locally. Real
  // enrollment is processed manually by Rent Depot ops after submission.
  document.getElementById('consent-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var name  = document.getElementById('name').value || 'Technician';
    var phone = document.getElementById('phone').value || '';
    var btn   = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    // Replace the form area with a thank-you confirmation
    document.getElementById('card').innerHTML =
      '<div class="logo">Rent Depot LLC</div>' +
      '<h1>Thanks, ' + name.replace(/[<>&"]/g, '') + '.</h1>' +
      '<p>Your SMS consent has been recorded for ' + phone.replace(/[<>&"]/g, '') + '.</p>' +
      '<div class="thanks">' +
        'You’ll start receiving work order notifications shortly. ' +
        'Reply <strong>STOP</strong> at any time to opt out. ' +
        'Questions? <a href="mailto:pm@rentdepot.com">pm@rentdepot.com</a> or ' +
        '<a href="tel:18447368337">844-736-8337</a>.' +
      '</div>' +
      '<div class="meta">Rent Depot LLC · PO Box 4, Evansville, IN 47701</div>';
  });
</script>
</body>
</html>
